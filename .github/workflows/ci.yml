name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run RAG Evaluation (Retrieval)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Evaluate RAG Retrieval Quality
        run: |
          # We run retrieval-only mode to avoid hitting paid LLM APIs during CI/CD.
          # This verifies that FAISS and Cross-Encoder load properly and retrieval metrics (Recall/MRR) meet the baseline.
          python eval_rag.py --retrieval-only

  build:
    name: Test Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t enterprise-ai-copilot .
